version: '3.8'

services:
  # 1. Zookeeper (Kafka 관리에 필요)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # 2. Kafka (메시지 큐)
  kafka:
    image: confluentinc/cp-kafka:7.0.1
    depends_on:
      - zookeeper
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 3. MySQL (소스 데이터베이스) - CDC를 위해 Binlog 활성화 설정 포함
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: de_password
      MYSQL_DATABASE: mydb
      MYSQL_USER: de_user
      MYSQL_PASSWORD: de_password
    # 중요: CDC를 위해 바이너리 로그 활성화 및 서버 ID 설정
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=row

  # 4. Kafka Connect (Debezium 포함 버전) - CDC 커넥터
  connect:
    image: debezium/connect:1.9
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - mysql
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
# 6. Flink JobManager (관리자 + 웹 대시보드)
  jobmanager:
    image: flink:1.18.1-java11
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    volumes:
      - ./flink-jars:/opt/flink/lib_external  # JAR 파일 넣을 폴더 연결
    depends_on:
      - kafka

  # 7. Flink TaskManager (일꾼)
  taskmanager:
    image: flink:1.18.1-java11
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
    volumes:
      - ./flink-jars:/opt/flink/lib_external  # JAR 파일 넣을 폴더 연결
# 8. MinIO (S3 호환 저장소)
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"